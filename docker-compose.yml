version: '3.8'

services:
  # PostgreSQL - Main relational database
  postgres:
    image: postgres:15-alpine
    container_name: ai-research-postgres
    environment:
      POSTGRES_USER: airesearch
      POSTGRES_PASSWORD: airesearch_dev_password
      POSTGRES_DB: airesearch
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airesearch']
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Document database for papers, posts, etc.
  mongodb:
    image: mongo:7
    container_name: ai-research-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: airesearch
      MONGO_INITDB_ROOT_PASSWORD: airesearch_dev_password
      MONGO_INITDB_DATABASE: airesearch
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/docker/init-scripts/mongo:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache and session store
  redis:
    image: redis:7-alpine
    container_name: ai-research-redis
    command: redis-server --requirepass airesearch_dev_password
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch - Full-text search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ai-research-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: ai-research-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: airesearch
      MINIO_ROOT_PASSWORD: airesearch_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # MLflow - Experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: ai-research-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://airesearch:airesearch_dev_password@postgres:5432/mlflow --default-artifact-root s3://mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: airesearch
      AWS_SECRET_ACCESS_KEY: airesearch_dev_password
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  minio_data:

networks:
  default:
    name: ai-research-network
